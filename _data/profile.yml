about: >-
  I'm a Research Assistant at [CityMind Lab](https://citymind.top/), HKUST(GZ). My recent research focuses on multimodal representation learning for unified understanding-and-generation autoregressive models in urban planning and architectural design. In artificial intelligence, I previously worked on representation learning at [Microsoft Research AI for Science](https://www.microsoft.com/en-us/research/lab/microsoft-research-ai-for-science/) and the [Zhongguancun Institute of AI](https://www.bjzgca.edu.cn/en/organization). In architecture and urban studies, I actively collaborate with researchers from [the School of Architecture at Southeast University](https://arch.seu.edu.cn/jz_en/main.htm) and [the Built Environment Technology Center at Tongji University](https://caup-lab.tongji.edu.cn/3b/76/c33896a211830/page.htm) on AI-assisted architectural and urban analysis and design. Beyond that, I also explored Human-AI Interaction projects on human cognition modeling and cognitive assistance at the [Augmenting & People by Empowering X (APEX) Group](https://www.mingmingfan.com/), HKUST(GZ).

