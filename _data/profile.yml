about: >-
  I’m a Research Assistant at CityMind Lab, HKUST(GZ), working on spatio-temporal foundation models and agents for urban computing. Previously, I was a research intern at Microsoft Research AI for Science and Zhongguancun Institute of AI, focusing on graph representation learning for autoregressive foundation models, advised by Dr. Yaosen Min and Dr. Peiran Jin. I received an M.Sc. in Data-Centric AI from HKUST(GZ) (advised by Prof. Lei Chen) and a B.Eng. in Artificial Intelligence from Southeast University, where I collaborated with Prof. Conghui Zhou on deep-learning-based pocket park planning with large-scale street-view data. I also explored Human-AI Interaction projects advised by Prof. Mingming Fan.

