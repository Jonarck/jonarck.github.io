about: |
  Zhuoyang Jiang is a Research Assistant at CityMind Lab, HKUST(GZ), working on spatio-temporal foundation models and agents for urban computing.
  Previously, he was a research intern at Microsoft Research AI for Science, focusing on graph representation learning for autoregressive foundation models, supervised by Dr. Yaosen Min and Dr. Peiran Jin.
  He received an M.Sc. in Data-Centric AI from HKUST(GZ) (co-advised by Prof. Lei Chen) and a B.Eng. in Artificial Intelligence from Southeast University, where he collaborated with Prof. Conghui Zhou on deep-learning-based pocket park planning with large-scale street-view data.
  He also explored Human-AI Interaction projects supervised by Prof. Mingming Fan.

