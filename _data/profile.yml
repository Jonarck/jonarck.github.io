about: >-
  I’m a Research Assistant at [CityMind Lab](https://citymind.top/), HKUST(GZ). Previously, I was a research intern at [Microsoft Research AI for Science](https://www.microsoft.com/en-us/research/lab/microsoft-research-ai-for-science/) and [Zhongguancun Institute of AI](https://www.bjzgca.edu.cn/en/organization), focusing on graph representation learning for autoregressive foundation models, advised by [Dr. Yaosen Min](https://scholar.google.com/citations?user=732nRkQAAAAJ&hl=en) and [Dr. Peiran Jin](https://www.semanticscholar.org/author/Peiran-Jin/50820195). I received an M.Sc. in Data-Centric AI from [HKUST(GZ)](https://www.hkust-gz.edu.cn/about/) (advised by [Prof. Lei Chen](https://cse.hkust.edu.hk/~leichen/)) and a B.Eng. in Artificial Intelligence from [Southeast University](https://www.seu.edu.cn/english/22456/list.htm), where I collaborated with [Prof. Conghui Zhou](https://arch.seu.edu.cn/jz_en/2019/1113/c41171a410224/page.htm) on deep-learning-based pocket park planning with large-scale street-view data. I also explored Human-AI Interaction projects advised by [Prof. Mingming Fan](https://www.mingmingfan.com/).

